[project]
name = "cryptobot"
version = "0.1.0"
description = "Advisory Telegram bot for dip-buying alerts on Binance spot (SOL/USDT, LINK/USDT)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-binance>=1.0.19",
    "python-telegram-bot>=21",
    "pandas>=2.2",
    "numpy>=1.26",
    "ta>=0.11",
    "SQLAlchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.7",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
